# Done to increase the memory available to gradle.
# WINDOWS-ROOT makes the JDK trust the Windows cert store — fixes the "PKIX / unable to
# find valid certification path" error caused by a proxy that re-signs HTTPS. Windows only.
org.gradle.jvmargs=-Xmx2G -Djavax.net.ssl.trustStoreType=WINDOWS-ROOT
org.gradle.parallel=true

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.6
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod Properties
mod_version=1.0.0
maven_group=com.waypointmenu
archives_base_name=waypointmenu

# Dependencies
# Fabric API: https://modrinth.com/mod/fabric-api/versions?g=1.21.11
fabric_version=0.141.6+1.21.11

# Mod Menu: https://github.com/TerraformersMC/ModMenu/releases
modmenu_version=17.0.0

# --- Proxy ---
# Route Gradle's traffic through the local proxy (v2rayN / Clash at 127.0.0.1:10808) so it
# can reach Mojang / services.gradle.org, which are otherwise blocked (HTTP 502 / PKIX).
# Keep the proxy running while building. 10808 is a mixed HTTP+SOCKS port; Gradle uses HTTP.
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=10808
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=10808
